<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1E40AF,#3B82F6);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:16px;padding:44px 40px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.25)}
.logo{text-align:center;margin-bottom:32px}
.logo-icon{font-size:52px}
.logo h1{font-size:22px;font-weight:700;color:#1E293B;margin-top:10px}
.logo p{color:#64748B;margin-top:4px;font-size:14px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:600;font-size:13px;color:#374151;margin-bottom:6px}
.field input{width:100%;border:2px solid #CBD5E1;border-radius:8px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.btn{width:100%;background:#2563EB;color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .2s;margin-top:4px}
.btn:hover{background:#1D4ED8}
.btn:disabled{background:#93C5FD;cursor:not-allowed}
.err{background:#FEF2F2;color:#DC2626;border:1px solid #FECACA;border-radius:8px;padding:11px 14px;font-size:13px;margin-bottom:16px;display:none}
.hint{text-align:center;margin-top:20px;color:#94A3B8;font-size:12px}
.hint code{background:#F1F5F9;padding:2px 7px;border-radius:4px;color:#475569}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏭</div>
    <h1>ระบบบันทึก OT</h1>
    <p>โรงงานอาหาร</p>
  </div>
  <div id="err" class="err"></div>
  <div class="field">
    <label>ชื่อผู้ใช้</label>
    <input type="text" id="u" placeholder="กรอกชื่อผู้ใช้" autofocus>
  </div>
  <div class="field">
    <label>รหัสผ่าน</label>
    <input type="password" id="p" placeholder="กรอกรหัสผ่าน">
  </div>
  <button class="btn" id="btn" onclick="login()">เข้าสู่ระบบ</button>
  <div class="hint">HR: <code>hr</code>/<code>hr1234</code> &nbsp;|&nbsp; หัวหน้าแผนก: username/<code>1234</code></div>
</div>
<script>
document.addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login(){
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='กำลังเข้าสู่ระบบ...';
  const res=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});
  const d=await res.json();
  if(d.success){ window.location.href=d.role==='hr'?'/dashboard':'/form'; }
  else{
    const e=document.getElementById('err');
    e.textContent=d.message; e.style.display='block';
    btn.disabled=false; btn.textContent='เข้าสู่ระบบ';
  }
}
</script>
</body>
</html>
